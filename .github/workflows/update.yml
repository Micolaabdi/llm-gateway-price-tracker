name: Update prices

on:
  schedule:
    - cron: "0 3 * * 1" # every Monday 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch prices
        run: python3 scripts/fetch_prices.py

      - name: Render README
        run: python3 scripts/render_readme.py

      - name: Commit if changed
        run: |
          git config user.name "price-bot"
          git config user.email "actions@github.com"
          git add data/data.json README.md
          if git diff --cached --quiet; then
            echo "No price changes — nothing to commit."
          else
            git commit -m "chore: weekly price update ($(date -u +%F))"
            git push
          fi
